    <circle cx="0" cy="-2" r="5.5" fill="#ffd268"/>
    <path d="M0,21 q-12,16 -26,20" stroke="#ffd268" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M118,148 C 128,130 136,112 144,94" stroke="#ffd268" stroke-width="3.5" stroke-dasharray="1 8" stroke-linecap="round" fill="none"/>
</svg>
