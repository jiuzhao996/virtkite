<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs><linearGradient id="tl2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a9da5"/><stop offset="1" stop-color="#1f7e84"/>
  </linearGradient></defs>
  <rect width="240" height="240" rx="48" fill="url(#tl2)"/>
  <!-- 三道 ~ 作为风（透明度渐变，营造远近） -->
  <g stroke="#bfe3e6" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M40,186 q13,-14 26,0 q13,14 26,0" opacity="0.85"/>
