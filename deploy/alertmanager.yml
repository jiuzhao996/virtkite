# Alertmanager 配置：接收 Prometheus 告警，分组去重后推送。
# 默认 webhook 为占位地址（演示不落地通知，只在 UI :9093 可见 firing 状态）；
# 生产请替换为钉钉/飞书/企业微信机器人 webhook（见下方注释示例）。
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    webhook_configs:
      # 占位：演示环境无真实通道，告警仅在 Alertmanager UI 可见
      - url: "http://127.0.0.1:5001/hook"
        send_resolved: false
    # 生产示例（钉钉群机器人，二选一，取消注释并填 key）：
    # - url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_KEY"
    #   send_resolved: true
