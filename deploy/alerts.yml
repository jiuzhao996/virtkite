groups:
  - name: vmops
    interval: 30s
    rules:
      # VM 宕机：DB 仍有记录但 libvirt 不见（running 序列消失且总数对不上时人工排查；
      # 此处按"运行中 VM 数骤降"告警，需按实际规模调阈值）
      - alert: VMRunningDrop
        expr: sum(vmops_vm_running) < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "运行中虚拟机数为 0（当前值 {{ $value }}）"

      # 宿主机 CPU 持续高位
      - alert: HostCpuHigh
        expr: vmops_host_cpu_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "宿主机 CPU {{ $value | printf \"%.1f\" }}% 持续 5 分钟超 85%"

      # 存储池空间不足（任一池可用比 < 10%）
      - alert: PoolSpaceLow
        expr: vmops_pool_available_bytes / vmops_pool_capacity_bytes < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "存储池 {{ $labels.pool }} 可用空间不足 10%"

      # 任务堆积（等待+执行超过 10 个，可能 worker 阻塞）
      - alert: TaskBacklog
        expr: vmops_tasks_pending + vmops_tasks_running > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "任务堆积 {{ $value }} 个，检查 worker 是否阻塞"

      # 单 VM CPU 持续跑满（排除刚启动预热）
      - alert: VMCpuHot
        expr: vmops_vm_cpu_percent > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "虚拟机 {{ $labels.vm }} CPU {{ $value | printf \"%.1f\" }}% 持续 10 分钟超 90%"

      # 平台自身失联（Prometheus 抓不到 /metrics，典型原因：vmops 进程挂了）
      - alert: VmopsDown
        expr: up{job="vmops"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "vmops 平台失联（Prometheus 抓取失败超 2 分钟）"

      # 宿主机内存持续高位
      - alert: HostMemHigh
        expr: vmops_host_mem_used_kib / vmops_host_mem_total_kib > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "宿主机内存占用 {{ $value | printf \"%.1f\" }}（已用/总量比值超 0.9 持续 5 分钟）"

      # 单 VM 内存持续高位
      - alert: VMMemHigh
        expr: vmops_vm_mem_used_kib / vmops_vm_mem_total_kib > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "虚拟机 {{ $labels.vm }} 内存占用超 90% 持续 10 分钟"

      # VM 磁盘 IO 持续跑高（读+写 > 50MB/s，按需调阈值）
      - alert: VMDiskIOHigh
        expr: vmops_vm_disk_read_bps + vmops_vm_disk_write_bps > 52428800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "虚拟机 {{ $labels.vm }} 磁盘 IO 超 50MB/s 持续 10 分钟"
