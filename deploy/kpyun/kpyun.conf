# 鸢航 VirtKite 公网入口（kpyun.fun）：TLS 终止在云，经 SSH 反向隧道回源家里平台
server {
    listen 80;
    server_name kpyun.fun www.kpyun.fun;
    return 301 https://kpyun.fun$request_uri;
}

server {
    listen 443 ssl;
    listen 4321 ssl;
    http2 on;
    server_name kpyun.fun www.kpyun.fun;

    ssl_certificate     /etc/nginx/kpyun/www.kpyun.fun.pem;
    ssl_certificate_key /etc/nginx/kpyun/www.kpyun.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 平台 Web/API：隧道口 18080 → 家里 vmops 8080
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Grafana 看板：/grafana/ 同源反代（公网监控中心用，HTTPS 页面嵌 http iframe 会被拦）
    # Grafana 静态资源（文件名带 hash）：长缓存，二次访问浏览器本地命中不走隧道
    location /grafana/public/ {
        proxy_pass http://127.0.0.1:13000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /grafana/ {
        # Grafana 配了 serve_from_sub_path：透传完整路径（勿用尾斜杠重写）
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # noVNC（控制台图形）：/vnc/ 前缀剥离后回源家里 websockify 6080，支持 wss 升级
    location /vnc/ {
        proxy_pass http://127.0.0.1:16081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
