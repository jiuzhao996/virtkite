# Prometheus 抓取配置：vmops 内建 exporter（GET /metrics，15s 间隔）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# 告警对接（替代 Prometheus 1.x 的 --alertmanager.url 参数）：规则命中后推给 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vmops
    static_configs:
      # host.docker.internal 经 compose 的 extra_hosts(host-gateway) 解析到宿主机网关，
      # 兼容两种形态：app 原生直跑（当前推荐形态）与 app 容器（端口已映射宿主机 8080）。
      # 若要切回纯容器形态的直连，可改回 targets: ["app:8080"]。
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics
    # 平台侧设置 METRICS_TOKEN 环境变量后，/metrics 要求 Bearer 认证：
    # 取消下行注释并保持两侧取值一致即可；未设置 METRICS_TOKEN 时必须保持注释状态。
    # authorization:
    #   credentials: <METRICS_TOKEN 的值>
    # file_sd 动态抓取目标（服务发现闭环）：平台侧 FILE_SD_PATH 指向本文件时由平台自动生成，
    # VM 内 node_exporter（:9100）与平台自身 exporter 都从该文件下发，无需改本配置。
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/*.json"]
        refresh_interval: 30s

# 双存储：本地 TSDB 长存 90d；vmops 业务指标 remote_write 推送到云端 VictoriaMetrics（短存 1 个月）
# 端点 8081 已在安全组放行；云端 nginx TLS + Basic Auth（凭据见 deploy/tls/.vm_basic.secret，不入库）
remote_write:
  - url: "https://kpyun.fun:8081/api/v1/write"
    basic_auth:
      username: virtkite
      password: "5138e87ed1e7f86e1e60ed2d"
    write_relabel_configs:
      # 只推平台业务指标（vmops_*），丢弃 go_/process_ 等运行时噪声
      - source_labels: [job]
        regex: vmops
        action: keep
