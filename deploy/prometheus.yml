# Prometheus 抓取配置：vmops 内建 exporter（GET /metrics，15s 间隔）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# 告警对接（替代 Prometheus 1.x 的 --alertmanager.url 参数）：规则命中后推给 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vmops
    static_configs:
      # host.docker.internal 经 compose 的 extra_hosts(host-gateway) 解析到宿主机网关，
      # 兼容两种形态：app 原生直跑（当前推荐形态）与 app 容器（端口已映射宿主机 8080）。
      # 若要切回纯容器形态的直连，可改回 targets: ["app:8080"]。
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics
