services:
  mysql:
    image: mysql:8.0.36
    container_name: vmops-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vmops
      MYSQL_USER: vmops
      MYSQL_PASSWORD: vmops123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmops-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: vmops
      DB_PASSWORD: vmops123
      DB_NAME: vmops
      # ⚠️ 生产环境请务必改掉下面的 JWT 密钥
      JWT_SECRET_KEY: change-me-please-use-a-strong-random-secret
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static

volumes:
  mysql-data:
