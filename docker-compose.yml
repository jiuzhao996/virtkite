services:
  mysql:
    image: mysql:8.0.36
    container_name: vmops-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vmops
      MYSQL_USER: vmops
      MYSQL_PASSWORD: vmops123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmops-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: vmops
      DB_PASSWORD: vmops123
      DB_NAME: vmops
      # ⚠️ 生产环境请务必改掉下面的 JWT 密钥
      JWT_SECRET_KEY: change-me-please-use-a-strong-random-secret
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      # 直通宿主机 libvirtd（监控与纳管需真实 KVM；无 KVM 的机器请注释掉，指标将为空但服务可启动）
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock

  # Prometheus：抓取 app:8080/metrics（内建 exporter，15s）
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vmops-prometheus
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--alertmanager.url=http://alertmanager:9093"

  # Alertmanager：告警分组去重（UI :9093，通知通道见 deploy/alertmanager.yml 注释）
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vmops-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  # Grafana：预置数据源 + vmops 看板（admin/admin，首次登录后改密）
  grafana:
    image: grafana/grafana:11.1.0
    container_name: vmops-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/vmops.yml:ro
      - ./deploy/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/vmops.yml:ro
      - ./deploy/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/vmops-overview.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
