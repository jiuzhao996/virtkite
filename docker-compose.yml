# ⚠️ 部署必读：本文件不再内含任何口令字面量，全部经 .env 注入且为「必填」占位（${VAR:?提示}）。
# 缺变量时 docker compose 直接报错拒绝启动——宁可起不来，也不要带着公开弱口令上线。
#
# 在同目录创建 .env（chmod 600，切勿入库），至少提供以下变量：
#   DB_PASSWORD=<强随机>            # MySQL 业务账号 vmops 的口令（mysql 与应用共用，必须一致）
#   MYSQL_ROOT_PASSWORD=<强随机>    # MySQL root 口令（仅初始化与健康检查使用）
#   GRAFANA_ADMIN_PASSWORD=<强随机> # Grafana admin 口令
#   JWT_SECRET_KEY=<强随机>         # 会话签名密钥
#   CREDENTIAL_MASTER_KEY=<强随机>  # VM SSH 凭据落库加密主密钥（必须独立于 JWT 密钥）
# 完整变量清单与生成命令见仓库根 .env.example（cp .env.example .env 后逐个填值）
#
# 🔄 存量部署迁移（仓库历史上出现过 vmops123 / root123 / admin 等弱口令，已全部视为泄露）：
#   1) 改库内口令：ALTER USER 'vmops'@'%' IDENTIFIED BY '<新口令>';（root 同理）
#   2) 把新口令写进 .env（MYSQL_PASSWORD 只在数据卷首次初始化时生效，改 .env 不会自动改库内口令）
#   3) docker compose up -d 重启生效；Grafana 需登录后改密或删除 grafana-data 卷重建
services:
  mysql:
    image: mysql:8.0.36
    container_name: vmops-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vmops
      MYSQL_USER: vmops
      # 业务账号 vmops 的口令：与应用侧 DB_PASSWORD 必须是同一个值，故共用一个变量
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（openssl rand -hex 24）}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（openssl rand -hex 24）}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 健康检查用 root 口令探测：变量插值在 YAML 解析前完成，-p 与口令拼接后即 "-p<明文>"
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmops-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: vmops
      # 必须与 mysql 服务的 MYSQL_PASSWORD 一致（同一变量），改库口令后两处同步生效
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（openssl rand -hex 24）}
      DB_NAME: vmops
      # ⚠️ 生产环境请务必改掉下面的 JWT 密钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 中设置强随机 JWT_SECRET_KEY（openssl rand -hex 32）}
      # 凭据加密主密钥（VM SSH 口令落库用 AES-256-GCM）：必须与 JWT 密钥分离——
      # 二者同源会让「轮换 JWT_SECRET_KEY」连带废掉全部历史凭据（表现为解密失败）。
      # 留空会回落 JWT 密钥并打警告日志，等于新特性未生效，故这里设为必填。
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?请在 .env 中设置强随机 CREDENTIAL_MASTER_KEY（openssl rand -hex 32），切勿与 JWT_SECRET_KEY 相同}
      SERVER_PORT: "8080"
      # 监控中心代理查询告警用（compose 网络内用服务名；宿主机直跑默认 127.0.0.1:9093）
      ALERTMANAGER_URL: http://alertmanager:9093
      # 仪表盘/虚拟机详情的历史曲线经 Prometheus query_range 查询
      PROMETHEUS_URL: http://prometheus:9090
      # Prometheus file_sd 目标文件（服务发现闭环）：与 prometheus 服务的挂载指向同一宿主机目录，
      # 平台每分钟把 running 且有 IP 的 VM 写入该文件（宿主机原生直跑时改在 .env 配置 FILE_SD_PATH）
      FILE_SD_PATH: /app/deploy/file_sd/targets.json
      # 告警网关令牌（可选）：设置后需同步在 deploy/alertmanager.yml 的 webhook url 追加 ?token=<值>
      # ALERT_WEBHOOK_TOKEN: change-me
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      # file_sd 目标文件：与 prometheus 服务挂载同一宿主机目录（见 prometheus.volumes）
      - ./deploy/file_sd:/app/deploy/file_sd
      # 直通宿主机 libvirtd（监控与纳管需真实 KVM；无 KVM 的机器请注释掉，指标将为空但服务可启动）
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock

  # noVNC 控制台中转（一键全容器形态必需；混合形态请勿启动——与宿主机 websockify 抢 6080）
  websockify:
    build:
      context: .
      dockerfile: docker/websockify.Dockerfile
    container_name: vmops-websockify
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "6080:6080"

  # Prometheus：抓取 vmops /metrics（内建 exporter，15s）
  # 不 depends_on app：app 支持宿主机原生直跑（推荐形态），容器内经 host-gateway 抓取
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: vmops-prometheus
    restart: unless-stopped
    extra_hosts:
      # 让 host.docker.internal 指向宿主机（app 原生直跑形态也能被容器内 Prometheus 抓到）
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # remote_write Basic Auth 密码文件（密码本体不入库，见 deploy/tls/.vm_basic.secret）
      - ./deploy/tls/.vm_basic.secret:/etc/prometheus/.vm_basic.secret:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      # file_sd 动态抓取目标（服务发现闭环）：平台侧 FILE_SD_PATH 写入该目录，30s 自动重载
      - ./deploy/file_sd:/etc/prometheus/file_sd
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 本地长存（双存储架构：本地 90 天，云端 VictoriaMetrics 短存 1 个月，remote_write 推送）
      - "--storage.tsdb.retention.time=90d"
      # 注意：Prometheus 2.x 已移除 --alertmanager.url 参数，告警对接在 prometheus.yml 的 alerting 段配置

  # Alertmanager：告警分组去重（UI :9093，通知通道见 deploy/alertmanager.yml 注释）
  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: vmops-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    extra_hosts:
      # 告警 webhook 推回平台（host.docker.internal:8080）需要宿主机网关别名
      - "host.docker.internal:host-gateway"
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  # Grafana：预置数据源 + vmops 看板（口令见 .env 的 GRAFANA_ADMIN_PASSWORD）
  grafana:
    image: grafana/grafana:13.2.1
    container_name: vmops-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD（openssl rand -hex 24）}
      # 供产品「监控中心」页 iframe 嵌入：开匿名只读 + 允许被嵌入（Grafana 11 默认拒绝）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 公网同源反代（https://kpyun.fun/grafana/）：子路径服务 + 根 URL 指向公网路径
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: https://kpyun.fun/grafana/
      # 匿名用户默认亮色主题（dark 是 Grafana 新版默认，与平台浅色 UI 不搭）
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_DEVICE_THEME_LIMIT: light
    volumes:
      - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/vmops.yml:ro
      - ./deploy/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/vmops.yml:ro
      - ./deploy/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/vmops-overview.json:ro
      - ./deploy/grafana-dashboard-vms.json:/etc/grafana/provisioning/dashboards/vmops-vms.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
