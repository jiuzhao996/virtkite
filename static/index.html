<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vmops · 私有云管理平台</title>

  <!-- CDN: Vue3 + Element Plus + Axios -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

  <style>
    /* ============================================================
       vmops — 复刻 OpsPilot 蓝白主题（毛玻璃 + 青蓝主色）
       ============================================================ */
    :root {
      --bg-primary: #e8f4f8;
      --bg-secondary: #dceef5;
      --bg-card: rgba(255, 255, 255, 0.55);
      --bg-card-solid: #ffffff;
      --bg-card-hover: rgba(255, 255, 255, 0.75);
      --bg-sidebar: rgba(255, 255, 255, 0.7);
      --bg-input: #f5f8fa;
      --bg-modal: #ffffff;

      --text-primary: #333333;
      --text-secondary: #555555;
      --text-muted: #888888;

      --accent: #3db8bf;
      --accent-light: #5cc9d0;
      --accent-dark: #2a9da5;

      --success: #27ae60;
      --success-bg: rgba(39, 174, 96, 0.08);
      --warning: #f39c12;
      --warning-bg: rgba(243, 156, 18, 0.08);
      --danger: #e74c3c;
      --danger-bg: rgba(231, 76, 60, 0.08);
      --info: #3db8bf;
      --info-bg: rgba(61, 184, 191, 0.08);

      --border: #e0e6ea;
      --border-light: #eef2f5;

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;

      --shadow-card: 0 1px 3px rgba(100, 160, 200, 0.06);
      --shadow-card-hover: 0 8px 24px rgba(100, 160, 200, 0.1);
      --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.12);

      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
        Arial, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

      --sidebar-width: 220px;
      --topbar-height: 56px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-family);
      background: linear-gradient(180deg, #e8f4f8 0%, #dceef5 40%, #c8e3f0 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c0d0d8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a0b8c0; }

    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--accent-dark); }
    h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; color: var(--text-primary); }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; font-size: 0.9rem; font-weight: 500;
      font-family: var(--font-family); border: 1px solid transparent;
      border-radius: var(--radius-sm); cursor: pointer;
      transition: all var(--transition); white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #3db8bf 0%, #2a9da5 100%); color: #fff; border: none; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(61,184,191,0.35); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-outline { background: transparent; color: var(--text-secondary); border-color: var(--border); }
    .btn-outline:hover:not(:disabled) { background: rgba(61,184,191,0.06); color: var(--accent); border-color: var(--accent); }
    .btn-sm { padding: 5px 12px; font-size: 0.85rem; }

    /* ---- Forms ---- */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 11px 14px; font-size: 0.95rem;
      font-family: var(--font-family); color: var(--text-primary);
      background: var(--bg-input); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,184,191,0.08); }

    /* ---- Card ---- */
    .card {
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.35);
      border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-card);
      backdrop-filter: blur(10px); transition: box-shadow var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-card-hover); }

    /* ---- Table ---- */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th {
      text-align: left; padding: 10px 12px; font-weight: 600; font-size: 0.8rem;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
    tr:hover td { background: rgba(61,184,191,0.03); }

    /* ---- Badge ---- */
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
      font-size: 0.8rem; font-weight: 600; border-radius: 20px; white-space: nowrap;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger  { background: var(--danger-bg); color: var(--danger); }
    .badge-info    { background: var(--info-bg); color: var(--accent); }
    .badge-muted   { background: rgba(136,136,136,0.08); color: var(--text-muted); }

    /* ---- Utility ---- */
    .text-muted { color: var(--text-muted); font-size: 0.9rem; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .mb-4 { margin-bottom: 1rem; }
    .card-grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    code { font-family: var(--font-mono); font-size: 0.85rem; background: var(--bg-input); padding: 2px 6px; border-radius: 3px; }

    /* ============ Layout ============ */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-width); background: var(--bg-sidebar);
      border-right: 1px solid rgba(0,0,0,0.06); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid rgba(0,0,0,0.06); height: var(--topbar-height); }
    .brand-icon { font-size: 1.3rem; flex-shrink: 0; }
    .brand-text { font-size: 1.1rem; font-weight: 700; color: #2a9da5; white-space: nowrap; }
    .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 8px;
      color: #555; font-size: 1.05rem; font-weight: 500; transition: all var(--transition);
      text-decoration: none; border-left: 3px solid transparent; white-space: nowrap;
    }
    .nav-item:hover { background: rgba(61,184,191,0.06); color: #333; }
    .nav-item.active { background: rgba(61,184,191,0.12); border-left-color: #3db8bf; color: #2a9da5; }
    .nav-icon { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
    .nav-label { white-space: nowrap; overflow: hidden; font-size: 1rem; }
    .main-area { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: var(--topbar-height); display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: linear-gradient(135deg, #3db8bf 0%, #2a9da5 100%); color: #fff;
      position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .topbar-title { font-size: 1rem; font-weight: 600; margin: 0; color: #fff; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 1rem; opacity: 0.95; }
    .role-badge { padding: 3px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.25); color: #fff; }
    .role-badge.admin { background: rgba(255,215,0,0.35); color: #ffd700; }
    .logout-btn {
      padding: 6px 18px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.95rem; transition: all 0.3s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }
    .content { flex: 1; padding: 24px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }

    .stat-card { display: flex; align-items: center; gap: 20px; padding: 26px 30px; }
    .stat-icon { font-size: 2.2rem; line-height: 1; }
    .stat-body { display: flex; flex-direction: column; gap: 2px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
    .stat-label { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }

    .sys-bars { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .bar-row { display: flex; align-items: center; gap: 14px; }
    .bar-label { font-size: 0.95rem; color: var(--text-muted); min-width: 44px; }
    .bar-pct { font-size: 1rem; font-weight: 600; min-width: 54px; text-align: right; }
    .bar-info { font-size: 0.85rem; color: var(--text-muted); min-width: 110px; }
    .progress { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
    .info-rows { display: flex; flex-direction: column; gap: 10px; }
    .info-rows > div { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
    .info-rows span:first-child { color: var(--text-muted); min-width: 64px; }

    .view-title { font-size: 1.25rem; margin-bottom: 0.75rem; }

    /* ---- Login ---- */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card {
      width: 100%; max-width: 400px; background: var(--bg-card-solid); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); padding: 36px 32px;
    }
    .login-brand { text-align: center; margin-bottom: 24px; }
    .login-brand .logo { font-size: 2.4rem; }
    .login-brand h1 { font-size: 1.4rem; color: #2a9da5; margin-top: 6px; }
    .login-brand p { font-size: 0.9rem; color: var(--text-muted); }
    .login-demo {
      margin-top: 18px; padding: 12px 14px; background: var(--info-bg); border: 1px solid rgba(61,184,191,0.2);
      border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--accent-dark); line-height: 1.8;
    }
    .login-error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(231,76,60,0.2); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1rem; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: var(--bg-modal); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal); padding: 24px; width: 90%; max-width: 460px;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue
    const { ElMessage, ElMessageBox } = ElementPlus

    const TOKEN_KEY = 'vmops_token'

    // ---- Axios 实例 ----
    const http = axios.create({ baseURL: '/api', timeout: 15000 })
    http.interceptors.request.use((cfg) => {
      const t = localStorage.getItem(TOKEN_KEY)
      if (t) cfg.headers.Authorization = 'Bearer ' + t
      return cfg
    })
    http.interceptors.response.use(
      (res) => res,
      (err) => {
        if (err.response && err.response.status === 401) {
          localStorage.removeItem(TOKEN_KEY)
          window.location.hash = '#/login'
        }
        return Promise.reject(err)
      }
    )

    const App = {
      setup() {
        const view = ref('login')
        const token = ref(localStorage.getItem(TOKEN_KEY) || '')
        const user = ref(null)
        const loading = ref(false)

        const isAdmin = computed(() => user.value && user.value.role === 'admin')

        async function bootstrap() {
          if (!token.value) { view.value = 'login'; return }
          try {
            const res = await http.get('/auth/me')
            user.value = res.data.data
            view.value = 'dashboard'
          } catch (e) {
            localStorage.removeItem(TOKEN_KEY)
            token.value = ''
            view.value = 'login'
          }
        }

        function onLoginSuccess(payload) {
          token.value = payload.access_token
          localStorage.setItem(TOKEN_KEY, payload.access_token)
          user.value = payload.user
          view.value = 'dashboard'
        }

        function logout() {
          localStorage.removeItem(TOKEN_KEY)
          token.value = ''
          user.value = null
          view.value = 'login'
        }

        function go(v) { view.value = v }

        onMounted(bootstrap)

        return { view, user, isAdmin, onLoginSuccess, logout, go }
      },
      template: `
        <div v-if="view === 'login'">
          <login-page @success="onLoginSuccess"></login-page>
        </div>
        <div v-else class="app-layout">
          <aside class="sidebar">
            <div class="sidebar-brand">
              <span class="brand-icon">🛡️</span>
              <span class="brand-text">vmops</span>
            </div>
            <nav class="sidebar-nav">
              <a href="#/dashboard" class="nav-item" :class="{ active: view === 'dashboard' }" @click.prevent="go('dashboard')">
                <span class="nav-icon">📊</span><span class="nav-label">仪表盘</span>
              </a>
              <a href="#/vms" class="nav-item" :class="{ active: view === 'vms' }" @click.prevent="go('vms')">
                <span class="nav-icon">🖥️</span><span class="nav-label">虚拟机</span>
              </a>
              <a href="#/hosts" class="nav-item" :class="{ active: view === 'hosts' }" @click.prevent="go('hosts')">
                <span class="nav-icon">🖥</span><span class="nav-label">宿主机</span>
              </a>
            </nav>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <div class="topbar-left"><h2 class="topbar-title">{{ view === 'dashboard' ? '仪表盘' : view === 'vms' ? '虚拟机管理' : '宿主机管理' }}</h2></div>
              <div class="topbar-right">
                <span class="user-info">
                  {{ isAdmin ? '👑' : '👤' }} {{ user ? user.username : '...' }}
                  <span class="role-badge" :class="isAdmin ? 'admin' : ''">{{ isAdmin ? '管理员' : '用户' }}</span>
                </span>
                <button class="logout-btn" @click="logout">退出</button>
              </div>
            </header>
            <main class="content">
              <dashboard-view v-if="view === 'dashboard'" :user="user"></dashboard-view>
              <vms-view v-else-if="view === 'vms'"></vms-view>
              <hosts-view v-else-if="view === 'hosts'"></hosts-view>
            </main>
          </div>
        </div>
      `
    }

    // ---- Login ----
    const LoginPage = {
      emits: ['success'],
      setup(props, { emit }) {
        const form = reactive({ username: '', password: '' })
        const error = ref('')
        const submitting = ref(false)

        async function submit() {
          error.value = ''
          if (!form.username || !form.password) { error.value = '请输入用户名和密码'; return }
          submitting.value = true
          try {
            const res = await http.post('/auth/login', { username: form.username, password: form.password })
            const d = res.data
            if (d.code === 200 && d.data) {
              emit('success', d.data)
            } else {
              error.value = d.message || '登录失败'
            }
          } catch (e) {
            error.value = (e.response && e.response.data && e.response.data.message) || '网络错误，请稍后重试'
          } finally {
            submitting.value = false
          }
        }

        return { form, error, submitting, submit }
      },
      template: `
        <div class="login-wrap">
          <div class="login-card">
            <div class="login-brand">
              <div class="logo">🛡️</div>
              <h1>vmops</h1>
              <p>基于 KVM 的轻量级私有云管理平台</p>
            </div>
            <div v-if="error" class="login-error">{{ error }}</div>
            <div class="form-group">
              <label>用户名</label>
              <input v-model="form.username" class="form-control" placeholder="请输入用户名" @keyup.enter="submit" />
            </div>
            <div class="form-group">
              <label>密码</label>
              <input v-model="form.password" type="password" class="form-control" placeholder="请输入密码" @keyup.enter="submit" />
            </div>
            <button class="btn btn-primary" style="width:100%;justify-content:center;" :disabled="submitting" @click="submit">
              {{ submitting ? '登录中...' : '登 录' }}
            </button>
            <div class="login-demo">
              💡 演示账号：<br/>
              · 管理员：<code>admin</code> / <code>password</code><br/>
              · 普通用户：<code>user</code> / <code>123456</code>
            </div>
          </div>
        </div>
      `
    }

    // ---- Dashboard ----
    const DashboardView = {
      props: { user: Object },
      setup() {
        const vmTotal = ref('—')
        const hostTotal = ref('—')
        const host = ref(null)
        const loading = ref(false)

        function fmtGB(b) { if (b == null) return '—'; return (b / 1024 / 1024 / 1024).toFixed(1) + ' GB' }
        function fmtPct(used, total) {
          if (!used || !total) return 0
          return Math.min(Math.round((used / total) * 100), 100)
        }
        function barColor(p) { return p > 90 ? '#e74c3c' : p > 70 ? '#f39c12' : '#27ae60' }
        function barStyle(p) { return 'width:' + p + '%;background:' + barColor(p) }
        function uptime(s) {
          if (!s) return '—'
          const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600)
          return d ? d + '天' + h + '小时' : h + '小时' + Math.floor((s % 3600) / 60) + '分'
        }

        async function load() {
          loading.value = true
          try {
            const [vms, hosts, hi] = await Promise.all([
              http.get('/vms'),
              http.get('/hosts'),
              http.get('/host').catch(() => null)
            ])
            vmTotal.value = (vms.data.data && vms.data.data.total) || 0
            hostTotal.value = (hosts.data.data && hosts.data.data.total) || 0
            if (hi && hi.data) host.value = hi.data
          } catch (e) {
            ElMessage.error('加载仪表盘数据失败')
          } finally {
            loading.value = false
          }
        }

        onMounted(load)

        return { vmTotal, hostTotal, host, loading, fmtGB, fmtPct, barStyle, uptime }
      },
      template: `
        <div>
          <div class="card-grid grid-2">
            <div class="card stat-card">
              <span class="stat-icon">🖥️</span>
              <div class="stat-body">
                <span class="stat-value">{{ vmTotal }}</span>
                <span class="stat-label">虚拟机总数</span>
              </div>
            </div>
            <div class="card stat-card">
              <span class="stat-icon">🖧</span>
              <div class="stat-body">
                <span class="stat-value">{{ hostTotal }}</span>
                <span class="stat-label">宿主机总数</span>
              </div>
            </div>
          </div>

          <div v-if="host" class="card" style="margin-top:20px;">
            <h3>📊 主控节点 · {{ host.hostname }}</h3>
            <div class="info-rows" style="margin-bottom:16px;">
              <div><span>内核</span><strong>{{ host.kernel || '—' }}</strong></div>
              <div><span>CPU</span><strong>{{ host.cpus != null ? host.cpus + ' 核' : '—' }}</strong></div>
              <div><span>运行</span><strong>{{ uptime(host.uptime) }}</strong></div>
              <div><span>内存</span><strong>{{ fmtGB(host.memUsed) }} / {{ fmtGB(host.memTotal) }}</strong></div>
            </div>
            <div class="sys-bars">
              <div class="bar-row">
                <span class="bar-label">内存</span>
                <span class="bar-pct">{{ fmtPct(host.memUsed, host.memTotal) }}%</span>
                <div class="progress"><div class="fill" :style="barStyle(fmtPct(host.memUsed, host.memTotal))"></div></div>
                <span class="bar-info">{{ fmtGB(host.memUsed) }} / {{ fmtGB(host.memTotal) }}</span>
              </div>
            </div>
          </div>

          <div class="card" style="margin-top:20px;">
            <h3>ℹ️ 系统信息</h3>
            <div class="info-rows">
              <div><span>平台</span><strong>vmops · KVM 私有云</strong></div>
              <div><span>后端</span>Go + Gin + JWT + Libvirt</div>
              <div><span>前端</span>Vue 3 + Element Plus</div>
              <div><span>当前用户</span>{{ user ? user.username : '—' }}（{{ user && user.role === 'admin' ? '管理员' : '用户' }}）</div>
            </div>
          </div>
        </div>
      `
    }

    // ---- VMs ----
    function vmStatusBadge(s) {
      if (s === 'running') return { cls: 'badge-success', txt: '运行中' }
      if (s === 'stopped' || s === 'shutoff') return { cls: 'badge-muted', txt: '已关机' }
      if (s === 'paused') return { cls: 'badge-warning', txt: '已暂停' }
      if (s === 'error') return { cls: 'badge-danger', txt: '异常' }
      return { cls: 'badge-info', txt: s || '未知' }
    }

    const VmsView = {
      setup() {
        const items = ref([])
        const total = ref(0)
        const loading = ref(false)
        const busy = ref(new Set())

        async function load() {
          loading.value = true
          try {
            const res = await http.get('/vms')
            items.value = (res.data.data && res.data.data.items) || []
            total.value = (res.data.data && res.data.data.total) || 0
          } catch (e) {
            ElMessage.error('获取虚拟机列表失败')
          } finally {
            loading.value = false
          }
        }

        async function action(vm, type) {
          busy.value.add(vm.id); busy.value = new Set(busy.value)
          const url = type === 'delete'
            ? '/vms/' + vm.id
            : '/vms/' + vm.id + '/' + type
          try {
            if (type === 'delete') {
              await ElMessageBox.confirm('确定要删除虚拟机「' + vm.name + '」吗？此操作不可撤销。', '确认删除', { type: 'warning' })
              await http.delete(url)
            } else {
              await http.post(url)
            }
            ElMessage.success(type === 'delete' ? '已删除' : ('已发送' + ({ start: '开机', stop: '关机', restart: '重启' }[type]) + '指令'))
            await load()
          } catch (e) {
            if (e !== 'cancel' && !(e instanceof Error && e.message === 'cancel')) {
              ElMessage.error((e.response && e.response.data && e.response.data.message) || '操作失败')
            }
          } finally {
            busy.value.delete(vm.id); busy.value = new Set(busy.value)
          }
        }

        onMounted(load)

        return { items, total, loading, busy, load, action, vmStatusBadge }
      },
      template: `
        <div>
          <div class="flex-between mb-4">
            <h3 class="view-title" style="margin:0;">虚拟机列表</h3>
            <button class="btn btn-primary btn-sm" :disabled="loading" @click="load">🔄 刷新</button>
          </div>
          <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>名称</th><th>宿主机</th><th>vCPU</th><th>内存</th><th>磁盘</th><th>IP</th><th>状态</th><th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-if="loading"><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">加载中...</td></tr>
                  <tr v-else-if="items.length === 0"><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">暂无虚拟机数据</td></tr>
                  <tr v-for="vm in items" :key="vm.id">
                    <td><strong>{{ vm.name }}</strong></td>
                    <td class="text-muted" style="font-size:0.85rem;">{{ vm.host_id || '—' }}</td>
                    <td>{{ vm.vcpu != null ? vm.vcpu + ' 核' : '—' }}</td>
                    <td>{{ vm.memory_mb != null ? (vm.memory_mb / 1024).toFixed(1) + ' GB' : '—' }}</td>
                    <td>{{ vm.disk_gb != null ? vm.disk_gb + ' GB' : '—' }}</td>
                    <td><code>{{ vm.ip || '—' }}</code></td>
                    <td><span class="badge" :class="vmStatusBadge(vm.status).cls">{{ vmStatusBadge(vm.status).txt }}</span></td>
                    <td>
                      <div style="display:flex;gap:4px;flex-wrap:wrap;">
                        <button class="btn btn-outline btn-sm" :disabled="busy.has(vm.id)" @click="action(vm,'start')">开机</button>
                        <button class="btn btn-outline btn-sm" :disabled="busy.has(vm.id)" @click="action(vm,'stop')">关机</button>
                        <button class="btn btn-outline btn-sm" :disabled="busy.has(vm.id)" @click="action(vm,'restart')">重启</button>
                        <button class="btn btn-danger btn-sm" :disabled="busy.has(vm.id)" @click="action(vm,'delete')">删除</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `
    }

    // ---- Hosts ----
    function hostStatusBadge(s) {
      if (s === 'online') return { cls: 'badge-success', txt: '在线' }
      if (s === 'offline') return { cls: 'badge-danger', txt: '离线' }
      if (s === 'unknown') return { cls: 'badge-muted', txt: '未知' }
      return { cls: 'badge-info', txt: s || '未知' }
    }

    const HostsView = {
      setup() {
        const items = ref([])
        const total = ref(0)
        const loading = ref(false)
        const testBusy = ref(new Set())
        const statsTarget = ref(null)
        const statsData = ref(null)

        async function load() {
          loading.value = true
          try {
            const res = await http.get('/hosts')
            items.value = (res.data.data && res.data.data.items) || []
            total.value = (res.data.data && res.data.data.total) || 0
          } catch (e) {
            ElMessage.error('获取宿主机列表失败')
          } finally {
            loading.value = false
          }
        }

        async function test(h) {
          testBusy.value.add(h.id); testBusy.value = new Set(testBusy.value)
          try {
            const res = await http.post('/hosts/' + h.id + '/test')
            const d = res.data.data || {}
            if (d.reachable) {
              ElMessage.success('连通 ✓ 延迟 ' + (d.latency_ms != null ? d.latency_ms + ' ms' : '—'))
            } else {
              ElMessage.warning('无法连通该宿主机')
            }
          } catch (e) {
            ElMessage.error((e.response && e.response.data && e.response.data.message) || '连通性测试失败')
          } finally {
            testBusy.value.delete(h.id); testBusy.value = new Set(testBusy.value)
          }
        }

        async function showStats(h) {
          statsTarget.value = h
          statsData.value = null
          try {
            const res = await http.get('/hosts/' + h.id + '/stats')
            statsData.value = res.data.data
          } catch (e) {
            statsData.value = { error: (e.response && e.response.data && e.response.data.message) || '获取失败' }
          }
        }

        function fmtGB(b) { if (b == null) return '—'; return (b / 1024 / 1024 / 1024).toFixed(1) + ' GB' }
        function uptime(s) {
          if (!s) return '—'
          const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600)
          return d ? d + '天' + h + '小时' : h + '小时' + Math.floor((s % 3600) / 60) + '分'
        }

        onMounted(load)

        return { items, total, loading, testBusy, statsTarget, statsData, load, test, showStats, fmtGB, uptime, hostStatusBadge }
      },
      template: `
        <div>
          <div class="flex-between mb-4">
            <h3 class="view-title" style="margin:0;">宿主机列表</h3>
            <button class="btn btn-primary btn-sm" :disabled="loading" @click="load">🔄 刷新</button>
          </div>
          <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-container">
              <table>
                <thead>
                  <tr><th>名称</th><th>SSH IP</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody>
                  <tr v-if="loading"><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">加载中...</td></tr>
                  <tr v-else-if="items.length === 0"><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">暂无宿主机数据</td></tr>
                  <tr v-for="h in items" :key="h.id">
                    <td><strong>{{ h.name }}</strong></td>
                    <td><code>{{ h.ssh_ip || '—' }}</code></td>
                    <td><span class="badge" :class="hostStatusBadge(h.status).cls">{{ hostStatusBadge(h.status).txt }}</span></td>
                    <td>
                      <div style="display:flex;gap:4px;">
                        <button class="btn btn-outline btn-sm" :disabled="testBusy.has(h.id)" @click="test(h)">
                          {{ testBusy.has(h.id) ? '测试中...' : '测试连通' }}
                        </button>
                        <button class="btn btn-outline btn-sm" @click="showStats(h)">查看状态</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div v-if="statsTarget" class="modal-overlay" @click.self="statsTarget = null">
            <div class="modal">
              <div class="modal-header">
                <h3>📊 {{ statsTarget.name }} 资源状态</h3>
                <button class="btn btn-outline btn-sm" @click="statsTarget = null">关闭</button>
              </div>
              <div v-if="!statsData" style="color:var(--text-muted);padding:20px 0;">加载中...</div>
              <div v-else-if="statsData.error" class="login-error">{{ statsData.error }}</div>
              <div v-else class="info-rows">
                <div><span>主机名</span><strong>{{ statsData.hostname }}</strong></div>
                <div><span>内核</span><strong>{{ statsData.kernel || '—' }}</strong></div>
                <div><span>CPU</span><strong>{{ statsData.cpu_cores != null ? statsData.cpu_cores + ' 核' : '—' }}</strong></div>
                <div><span>运行</span><strong>{{ uptime(statsData.uptime) }}</strong></div>
                <div><span>内存</span><strong>{{ fmtGB(statsData.memory_used) }} / {{ fmtGB(statsData.memory_total) }}</strong></div>
              </div>
            </div>
          </div>
        </div>
      `
    }

    const app = createApp(App)
    app.use(ElementPlus)
    app.component('login-page', LoginPage)
    app.component('dashboard-view', DashboardView)
    app.component('vms-view', VmsView)
    app.component('hosts-view', HostsView)
    app.mount('#app')
  </script>
</body>
</html>
