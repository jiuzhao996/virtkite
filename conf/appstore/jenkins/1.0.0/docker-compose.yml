# Jenkins —— 命名卷 jenkins_home 存全部数据；普通容器运行，
# 不挂 docker.sock 不加 privileged（需要构建镜像时建议接独立 agent 节点）
services:
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "${PANEL_APP_PORT}:8080"
    environment:
      JAVA_OPTS: ${PANEL_JENKINS_JAVA_OPTS}
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
# 顶层 volumes 声明命名卷（实际卷名带项目前缀：jenkins_jenkins_home）
volumes:
  jenkins_home:
