# MongoDB 1.0.0 —— 版本级表单定义（密码项预置随机占位串，安装时可改）
additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT
      label: 服务端口
      type: number
      default: 27017
      required: true
      rule: paramPort
    - envKey: PANEL_MONGO_ROOT_USER
      label: root 用户名
      type: text
      default: admin
      required: true
    - envKey: PANEL_MONGO_ROOT_PASSWORD
      label: root 密码
      type: password
      default: Mo4tYe8Rc2Vx7LwH
      required: true
