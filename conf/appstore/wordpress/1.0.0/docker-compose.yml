# WordPress —— 双服务：wordpress 前端 + mysql:8.0 内置依赖，DB 密码经 env 串联；
# db 健康检查用 $$MYSQL_ROOT_PASSWORD（容器内 shell 展开），就绪后才放行 wordpress 启动
services:
  wordpress:
    image: wordpress:6.7-apache
    ports:
      - "${PANEL_APP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${PANEL_WP_DB_NAME}
      WORDPRESS_DB_USER: ${PANEL_WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${PANEL_WP_DB_PASSWORD}
    volumes:
      - ./data/wordpress:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${PANEL_WP_DB_NAME}
      MYSQL_USER: ${PANEL_WP_DB_USER}
      MYSQL_PASSWORD: ${PANEL_WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PANEL_WP_DB_ROOT_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
