# code-server 1.0.0 —— 版本级表单定义（密码项预置随机占位串，安装时可改）
additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT
      label: 服务端口
      type: number
      default: 8443
      required: true
      rule: paramPort
    - envKey: PANEL_CODE_SERVER_PASSWORD
      label: 访问密码
      type: password
      default: Cs5wDe7Vb3Fg8HqN
      required: true
    - envKey: PANEL_PUID
      label: PUID（运行用户 UID）
      type: text
      default: 1000
      required: false
    - envKey: PANEL_PGID
      label: PGID（运行用户 GID）
      type: text
      default: 1000
      required: false
    - envKey: PANEL_TZ
      label: 时区
      type: text
      default: Asia/Shanghai
      required: false
