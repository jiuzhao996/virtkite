# MinIO —— server /data 提供 S3 API，--console-address 固定容器内 9001 供 Web 控制台；
# 健康检查用镜像内置的 mc ready local（新版官方推荐写法，镜像自带 mc）
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${PANEL_APP_PORT_API}:9000"
      - "${PANEL_APP_PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: ${PANEL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PANEL_MINIO_ROOT_PASSWORD}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
