# vmops golangci-lint 配置
# 运行：golangci-lint run ./...
run:
  timeout: 3m
  # 目标 Go 语言版本：必须与 go.mod 的 `go 1.25.0` 保持一致（此处取 major.minor），
  # 否则 linter 会按旧版本语言规则检查，误报/漏报新语法
  go: "1.25"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gofmt
    - revive
  disable:
    - gosimple

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    # 交互式控制台 WS 错误保留细节属故意（见 AGENTS.md）
    - path: handler/terminal\.go|handler/serial\.go
      linters:
        - revive