# vmops-stack: id=nginx-lb | category=Web | desc=Nginx 负载均衡：LB（upstream 轮询）+ 两台后端验证页 | docs=Web/Nginx/Nginx04.md, Web/Nginx/Nginx01.md
# ==============================================================================
# 栈名称: nginx-lb
# 来源笔记: Web/Nginx/Nginx04.md（upstream 负载均衡 lb.conf 原文）、Nginx01.md（nginx 版本）
# 说明: Nginx 反向代理负载均衡——nginx-lb 对 upstream webs（web01/web02 两台后端）轮询，
#       proxy 参数为笔记 lb.conf 原文；两台后端为 nginx 静态页示例（web01_index/web02-index，
#       轮流 curl 可见两台轮询，与笔记验证现象一致）。
# 提取置信度: 手工组装——笔记为裸机 nginx（nginx.org 官方源，nginx/1.30.3）+ /etc/nginx/conf.d/
#            配置；lb.conf 的 upstream 与 proxy_* 参数逐行取自笔记原文，仅将后端 IP
#            （172.16.1.7/172.16.1.8）替换为容器服务名。nginx 版本 tag 取笔记验证过的
#            官方源版本 1.30.3。
# 使用注意:
#   1. nginx.conf 由容器启动时内联生成（单文件栈约束，不依赖额外挂载文件）
#   2. 访问验证: curl -H 'Host: test.kpyun.com' http://<宿主机IP>/ 交替返回
#      web01_index / web02-index（笔记原始验证内容）
#   3. 笔记另演示了 ip_hash/backup/weight 等调度策略，改 upstream 块即可
# ==============================================================================
# docs: Web/Nginx/Nginx04.md, Web/Nginx/Nginx01.md

version: "3.8"

services:
  nginx-lb:
    # 笔记验证版本: nginx version: nginx/1.30.3（nginx.org 官方源安装结果）
    image: nginx:1.30.3
    container_name: nginx-lb
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        # ---- 以下为笔记 Nginx04 lb.conf 原文（后端 IP 改为容器服务名） ----
        upstream webs {
            server web01;
            server web02;
        }
        # upstream 是 Nginx 用于定义一组后端服务器的指令
        # upstream 模块必须定义在 server 块的外部
        server {
            listen 80;
            server_name test.kpyun.com;

            location / {
                proxy_pass http://webs;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_http_version 1.1;

                proxy_connect_timeout 30;
                proxy_send_timeout 60;
                proxy_read_timeout 60;

                proxy_buffering on;
                proxy_buffer_size 32k;
                proxy_buffers 4 128k;
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
    depends_on:
      - web01
      - web02
    restart: unless-stopped

  web01:
    image: nginx:1.30.3
    container_name: web01
    command:
      - /bin/sh
      - -c
      # 笔记后端验证页: echo 'web01_index' > /code/test/index.html
      - echo web01_index > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    restart: unless-stopped

  web02:
    image: nginx:1.30.3
    container_name: web02
    command:
      - /bin/sh
      - -c
      # 笔记后端验证页: echo 'web02-index' > /code/test/index.html
      - echo web02-index > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    restart: unless-stopped
